version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: trueprice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trueprice
      POSTGRES_PASSWORD: trueprice_dev
      POSTGRES_DB: trueprice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trueprice"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
